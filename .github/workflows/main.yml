name: Daily news scrape

on:
  schedule:
    # 04:15 UTC = 06:15 Europe/Berlin (CEST). Note: fixed UTC time, so this
    # drifts to 07:15 local once Berlin switches to CET (winter).
    - cron: '15 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install R and packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-xml2 r-cran-rvest r-cran-httr

      - name: Run scraper
        run: Rscript fetch_news.R

      - name: Move output into data/ and commit
        run: |
          mkdir -p data
          mv actualites_global_*.csv data/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily news scrape $(date -u +%Y-%m-%d)"
            git push
          fi
